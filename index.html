<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>솔 인첸트</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Song+Myung&family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root{
    --bg:#120c1f;
    --bg-2:#180f26;
    --surface:#1d1530;
    --surface-2:#26193f;
    --gold:#e0b15c;
    --gold-bright:#f6d488;
    --violet:#9b7bff;
    --violet-soft:rgba(155,123,255,0.16);
    --text:#f2ead9;
    --text-muted:#a595b8;
    --success:#6fd08c;
    --danger:#e0707a;
    --border:rgba(224,177,92,0.22);
    --radius:14px;
    --shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #2a1d46 0%, transparent 55%),
      radial-gradient(circle at 90% 100%, #1a2a46 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh; display:flex; flex-direction:column; align-items:center;}

  .brand-kr{font-family:'Song Myung', serif;}
  .brand-en{font-family:'Cinzel', serif; letter-spacing:.28em; text-transform:uppercase;}

  a, button, input, select, textarea{font-family:inherit;}
  button{cursor:pointer;}
  input, select, textarea{
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    outline:none;
    width:100%;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(224,177,92,0.18);
  }
  input::placeholder, textarea::placeholder{color:var(--text-muted);}

  /* ---------- rune emblem ---------- */
  .rune{ display:block; }
  .rune-spin{ animation:spin 70s linear infinite; transform-origin:50% 50%; }
  .rune-spin-rev{ animation:spinrev 90s linear infinite; transform-origin:50% 50%; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spinrev{ to{ transform:rotate(-360deg); } }
  @media (prefers-reduced-motion: reduce){
    .rune-spin, .rune-spin-rev{ animation:none; }
  }

  /* ---------- login screen ---------- */
  .login-wrap{
    flex:1; width:100%; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; position:relative;
  }
  .login-card{
    width:100%; max-width:380px;
    background:linear-gradient(180deg, var(--surface) 0%, var(--bg-2) 100%);
    border:1px solid var(--border); border-radius:20px;
    padding:36px 28px 30px; box-shadow:var(--shadow);
    position:relative; z-index:2; text-align:center;
  }
  .emblem-box{ width:96px; height:96px; margin:0 auto 14px; position:relative; }
  .login-title{
    font-size:30px; letter-spacing:.04em; margin:6px 0 2px;
    color:var(--gold-bright); text-shadow:0 0 18px rgba(224,177,92,0.35);
  }
  .login-sub{ font-size:11px; color:var(--text-muted); margin-bottom:26px; }
  .field{margin-bottom:12px; text-align:left;}
  .field label{ display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .err-msg{ color:var(--danger); font-size:12.5px; margin:-2px 0 10px; text-align:left; min-height:16px; }
  .btn-primary{
    width:100%; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241705; font-weight:700; font-size:15px; margin-top:6px;
    box-shadow:0 6px 18px rgba(224,177,92,0.25);
    transition:transform .1s, box-shadow .15s;
  }
  .btn-primary:hover{ box-shadow:0 8px 22px rgba(224,177,92,0.4); }
  .btn-primary:active{ transform:translateY(1px); }
  .btn-primary:disabled{ opacity:.55; cursor:default; }
  .switch-link{ margin-top:18px; font-size:13px; color:var(--text-muted); }
  .switch-link button{
    background:none; border:none; color:var(--violet);
    font-size:13px; font-weight:700; text-decoration:underline; padding:0;
  }

  /* ---------- app shell ---------- */
  .app-shell{ width:100%; max-width:520px; min-height:100vh; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 14px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:rgba(18,12,31,0.92);
    backdrop-filter:blur(6px); z-index:10;
  }
  .topbar-left{display:flex; align-items:center; gap:10px;}
  .topbar-emblem{width:34px; height:34px;}
  .topbar-title{font-size:17px; color:var(--gold-bright); letter-spacing:.02em;}
  .topbar-user{font-size:11.5px; color:var(--text-muted); margin-top:1px;}
  .logout-btn{
    background:transparent; border:1px solid var(--border);
    color:var(--text-muted); border-radius:8px; padding:7px 11px; font-size:12.5px;
  }
  .logout-btn:hover{ color:var(--text); border-color:var(--gold); }

  .tabbar{ display:flex; gap:6px; padding:12px 14px 0; }
  .tab-btn{
    flex:1; background:var(--surface); border:1px solid var(--border);
    color:var(--text-muted); padding:10px 6px; border-radius:10px 10px 0 0;
    font-size:12.5px; font-weight:500; display:flex; flex-direction:column;
    align-items:center; gap:4px; border-bottom:none;
  }
  .tab-btn.active{
    color:var(--gold-bright); background:var(--surface-2);
    box-shadow:0 -2px 0 var(--gold) inset;
  }

  .content{ flex:1; background:var(--surface-2); padding:16px 16px 90px; overflow-y:auto; }
  .section-desc{ font-size:12.5px; color:var(--text-muted); margin:2px 0 16px; }
  .date-heading{
    font-size:12px; color:var(--gold); font-weight:700; letter-spacing:.04em;
    margin:18px 0 8px; display:flex; align-items:center; gap:8px;
  }
  .date-heading::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, var(--border), transparent);
  }
  .date-heading:first-child{ margin-top:0; }

  .record-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 14px 12px; margin-bottom:10px; position:relative;
  }
  .record-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .record-title{ font-size:14.5px; font-weight:700; color:var(--text); }
  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; display:inline-block; }
  .badge-win{ background:rgba(111,208,140,0.16); color:var(--success); }
  .badge-lose{ background:rgba(224,112,122,0.16); color:var(--danger); }
  .badge-in{ background:rgba(224,177,92,0.16); color:var(--gold-bright); }
  .badge-out{ background:var(--violet-soft); color:var(--violet); }
  .badge-neutral{ background:var(--violet-soft); color:var(--violet); }
  .record-meta{ font-size:12.5px; color:var(--text-muted); line-height:1.6; }
  .record-meta b{ color:var(--text); font-weight:600; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .chip{ background:var(--violet-soft); color:var(--violet); font-size:11.5px; padding:3px 9px; border-radius:20px; }
  .record-foot{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:8px; font-size:11px; color:var(--text-muted);
  }
  .del-btn{ background:none; border:none; color:var(--text-muted); font-size:16px; line-height:1; padding:2px 4px; }
  .del-btn:hover{ color:var(--danger); }

  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-emblem{ width:56px; height:56px; margin:0 auto 14px; opacity:.5; }
  .empty-state p{ font-size:13.5px; }

  .fab{
    position:fixed; bottom:26px; left:50%; transform:translateX(calc(-50% + 220px));
    width:56px; height:56px; border-radius:50%; border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#241705; font-size:26px; font-weight:700;
    box-shadow:0 8px 24px rgba(224,177,92,0.4); z-index:20;
  }
  @media (max-width:559px){ .fab{ left:auto; right:22px; transform:none; } }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,5,14,0.72);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-card{
    width:100%; max-width:520px; background:var(--surface);
    border:1px solid var(--border); border-radius:20px 20px 0 0;
    padding:22px 20px 26px; max-height:88vh; overflow-y:auto;
  }
  .modal-title{
    font-size:17px; color:var(--gold-bright); margin-bottom:16px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .modal-close{ background:none; border:none; color:var(--text-muted); font-size:20px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  .loading-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; color:var(--text-muted); font-size:13px;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); padding:11px 18px; border-radius:16px;
    font-size:12.5px; box-shadow:var(--shadow); z-index:80;
    max-width:90%; white-space:pre-line; text-align:center;
  }
  .toast.err{ border-color:var(--danger); color:var(--danger); }
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, deleteDoc, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============ Firebase 연결 ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCSe6GnDZ020bGchl_nCX_WaEALS-8Acek",
  authDomain: "sol-cff63.firebaseapp.com",
  projectId: "sol-cff63",
  storageBucket: "sol-cff63.firebasestorage.app",
  messagingSenderId: "289679914645",
  appId: "1:289679914645:web:5c0145d684216ba689cd9c"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const COLLECTIONS = { pvp:'pvpRecords', storage:'guildStorageRecords', boss:'bossRecords' };

/* ============ rune SVG ============ */
function runeSVG(size){
  return `
  <svg class="rune" viewBox="0 0 100 100" width="${size}" height="${size}">
    <g class="rune-spin">
      <circle cx="50" cy="50" r="46" fill="none" stroke="var(--gold)" stroke-width="1.1" opacity="0.55"/>
      ${Array.from({length:12}).map((_,i)=>{
        const a = (i*30)*Math.PI/180;
        const x1 = 50+42*Math.cos(a), y1 = 50+42*Math.sin(a);
        const x2 = 50+46*Math.cos(a), y2 = 50+46*Math.sin(a);
        return `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="var(--gold)" stroke-width="1" opacity="0.5"/>`;
      }).join('')}
    </g>
    <g class="rune-spin-rev">
      <circle cx="50" cy="50" r="32" fill="none" stroke="var(--violet)" stroke-width="1" opacity="0.6" stroke-dasharray="3 5"/>
    </g>
    <circle cx="50" cy="50" r="20" fill="none" stroke="var(--gold-bright)" stroke-width="1.4" opacity="0.85"/>
    <path d="M50 34 L58 50 L50 66 L42 50 Z" fill="var(--gold-bright)" opacity="0.9"/>
  </svg>`;
}

/* ============ helpers ============ */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const dt = new Date(d+'T00:00:00');
  const days = ['일','월','화','수','목','금','토'];
  return `${d.slice(5).replace('-','.')} (${days[dt.getDay()]})`;
}

/* ============ Firestore 데이터 함수 ============ */
async function fetchUser(id){
  const snap = await getDoc(doc(db, 'users', id));
  return snap.exists() ? snap.data() : null;
}
async function createUser(id, data){
  await setDoc(doc(db, 'users', id), data);
}
async function fetchRecords(type){
  const snap = await getDocs(collection(db, COLLECTIONS[type]));
  return snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
}
async function createRecord(type, data){
  const ref = await addDoc(collection(db, COLLECTIONS[type]), data);
  return ref.id;
}
async function removeRecord(type, id){
  await deleteDoc(doc(db, COLLECTIONS[type], id));
}
async function fetchSetting(key){
  const snap = await getDoc(doc(db, 'settings', key));
  return snap.exists() ? (snap.data().value || '') : '';
}
async function saveSetting(key, value){
  await setDoc(doc(db, 'settings', key), { value, updatedAt:Date.now() });
}
async function fetchGuildTracker(){
  const v = await fetchSetting('guildTracker');
  return (v && typeof v === 'object') ? Object.assign({ guildName:'', count:0, keys:[] }, v) : { guildName:'', count:0, keys:[] };
}
async function saveGuildTracker(tracker){
  await saveSetting('guildTracker', tracker);
}

/* ============ 앱 상태 ============ */
let state = {
  screen:'loading',
  errorMsg:'',
  user:null,
  activeTab:'pvp',
  records:{ pvp:[], storage:[], boss:[] },
  modalOpen:false,
  toast:null,
  toastErr:false,
  guildTracker:{ guildName:'', count:0, keys:[] },
  guildModalOpen:false,
  ocrBusy:false,
  ocrProgress:'',
  ocrDebugOpen:false,
  ocrDebugText:'',
  ocrDebugImage:'',
};
function setState(patch){
  state = Object.assign({}, state, patch);
  render();
}
function showToast(msg, isErr){
  setState({ toast:msg, toastErr:!!isErr });
  setTimeout(()=>setState({toast:null}), 4200);
}

function loadSession(){
  try{
    const raw = localStorage.getItem('solEnchantSession');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSession(user){
  try{ localStorage.setItem('solEnchantSession', JSON.stringify(user)); }catch(e){}
}
function clearSession(){
  try{ localStorage.removeItem('solEnchantSession'); }catch(e){}
}

async function init(){
  const saved = loadSession();
  if(saved && saved.id){
    await enterApp(saved, true);
  }else{
    setState({ screen:'login' });
  }
}

/* ============ 인증 ============ */
async function handleSignup(nickname, pw, remember){
  nickname = (nickname||'').trim();
  if(!nickname || !pw){ setState({errorMsg:'닉네임과 비밀번호를 입력해 주세요.'}); return; }
  if(nickname.includes('/')){ setState({errorMsg:"닉네임에 '/' 문자는 쓸 수 없어요."}); return; }
  if(pw.length < 6 || pw.length > 10){ setState({errorMsg:'비밀번호는 6~10자여야 해요.'}); return; }
  try{
    const existing = await fetchUser(nickname);
    if(existing){ setState({errorMsg:'이미 사용 중인 닉네임이에요.'}); return; }
    const hash = await sha256(pw);
    await createUser(nickname, { password:hash, nickname, createdAt:Date.now() });
    await enterApp({ id:nickname, nickname }, remember);
  }catch(e){
    console.error(e);
    setState({errorMsg:'서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요.'});
  }
}
async function handleLogin(nickname, pw, remember){
  nickname = (nickname||'').trim();
  if(!nickname || !pw){ setState({errorMsg:'닉네임과 비밀번호를 입력해 주세요.'}); return; }
  try{
    const u = await fetchUser(nickname);
    if(!u){ setState({errorMsg:'존재하지 않는 닉네임이에요.'}); return; }
    const hash = await sha256(pw);
    if(hash !== u.password){ setState({errorMsg:'비밀번호가 일치하지 않아요.'}); return; }
    await enterApp({ id:nickname, nickname:u.nickname }, remember);
  }catch(e){
    console.error(e);
    setState({errorMsg:'서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요.'});
  }
}
async function enterApp(user, remember){
  setState({ screen:'loading' });
  try{
    const [pvp, storageRecs, boss, guildTracker] = await Promise.all([
      fetchRecords('pvp'), fetchRecords('storage'), fetchRecords('boss'), fetchGuildTracker()
    ]);
    if(remember){ saveSession(user); } else { clearSession(); }
    setState({ screen:'app', user, records:{pvp, storage:storageRecs, boss}, guildTracker, errorMsg:'' });
  }catch(e){
    console.error(e);
    setState({ screen:'login', errorMsg:'데이터를 불러오지 못했어요. 다시 로그인해 주세요.' });
  }
}
function handleLogout(){
  clearSession();
  setState({ screen:'login', user:null, errorMsg:'', activeTab:'pvp' });
}

/* ============ 기록 ============ */
async function addRecord(type, data){
  try{
    const rec = Object.assign({ author:state.user.id, authorNick:state.user.nickname, createdAt:Date.now() }, data);
    const id = await createRecord(type, rec);
    const records = Object.assign({}, state.records, { [type]: state.records[type].concat([Object.assign({id}, rec)]) });
    setState({ records, modalOpen:false });
    showToast('기록이 추가됐어요.');
  }catch(e){
    console.error(e);
    showToast('저장에 실패했어요. 다시 시도해 주세요.', true);
  }
}
async function deleteRecord(type, id){
  try{
    await removeRecord(type, id);
    const records = Object.assign({}, state.records, { [type]: state.records[type].filter(r=>r.id!==id) });
    setState({ records });
  }catch(e){
    console.error(e);
    showToast('삭제에 실패했어요. 다시 시도해 주세요.', true);
  }
}

/* ============ 상대 길드 등록 ============ */
async function saveGuildName(){
  const val = (document.getElementById('f-guild-name')||{}).value || '';
  const name = val.trim();
  const errEl = document.getElementById('guild-err');
  try{
    const newTracker = { guildName:name, count:0, keys:[] };
    await saveGuildTracker(newTracker);
    setState({ guildTracker:newTracker, guildModalOpen:false });
    showToast(name ? '상대 길드가 등록됐어요. (카운트 0으로 초기화)' : '상대 길드 등록이 해제됐어요.');
  }catch(e){
    console.error(e);
    if(errEl) errEl.textContent = '저장에 실패했어요.';
  }
}

/* ============ 스크린샷 OCR ============ */
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('tesseract load failed'));
    document.head.appendChild(s);
  });
  return tesseractLoadPromise;
}

function loadImageFromFile(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('이미지를 불러오지 못했어요.'));
    img.src = URL.createObjectURL(file);
  });
}

async function preprocessForOcr(file){
  const img = await loadImageFromFile(file);
  const scale = 2;
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.width * scale);
  canvas.height = Math.round(img.height * scale);
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imageData.data;
  for(let i=0;i<d.length;i+=4){
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const val = 255 - lum; // 단순 반전: 밝은 글자->어두운 글자, 어두운 배경->밝은 배경
    d[i]=d[i+1]=d[i+2]=val;
  }
  ctx.putImageData(imageData, 0, 0);
  return canvas;
}

function levenshtein(a, b){
  a = a||''; b = b||'';
  const m = a.length, n = b.length;
  if(m===0) return n;
  if(n===0) return m;
  const dp = [];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}
function fuzzyGuildMatch(token, target){
  target = (target||'').trim();
  if(!target) return true;
  token = (token||'').trim();
  if(!token) return false;
  if(token.includes(target) || target.includes(token)) return true;
  const dist = levenshtein(token, target);
  const maxLen = Math.max(token.length, target.length);
  return maxLen > 0 && (dist / maxLen) <= 0.34;
}

function cleanToken(s){
  return (s||'').replace(/[^\uAC00-\uD7A3a-zA-Z0-9\s]/g, '').trim();
}

function parsePvpOcrText(text){
  const rows = [];
  const anchorRe = /(\d{4})\s*[\/\.\-]\s*(\d{2})\s*[\/\.\-]\s*(\d{2})[^\d]{1,4}(\d{1,2})\s*[:.]\s*(\d{2})/g;
  const anchors = [];
  let m;
  while((m = anchorRe.exec(text))){
    anchors.push({
      index:m.index, len:m[0].length,
      date:`${m[1]}-${m[2]}-${m[3]}`,
      time:`${m[4].padStart(2,'0')}:${m[5]}`
    });
  }
  for(let i=0;i<anchors.length;i++){
    const start = anchors[i].index + anchors[i].len;
    const nextAnchorIdx = i+1 < anchors.length ? anchors[i+1].index : text.length;
    const cappedEnd = Math.min(start + 60, text.length); // 날짜 뒤 일정 길이까지만 (엉뚱한 뒷부분 텍스트 유입 방지)
    const end = Math.min(nextAnchorIdx, cappedEnd);
    let chunk = text.slice(start, end).replace(/\n/g,' ').trim();

    let result = null;
    if(/처치/.test(chunk)) result = '처치';
    else if(/도움/.test(chunk)) result = '도움';
    else if(/사망/.test(chunk)) result = '사망';
    if(result) chunk = chunk.replace(result, '').trim();

    let tokens = chunk.split(/\s+/).map(cleanToken).filter(Boolean);
    let loot = '';
    if(tokens.length && /^[\d,]+$/.test(tokens[tokens.length-1])){
      loot = tokens.pop();
    }
    let guildToken = '';
    if(tokens.length >= 2){
      guildToken = tokens.pop();
    }
    const opponent = tokens.join(' ').trim();
    if(!opponent) continue;

    rows.push({ date:anchors[i].date, time:anchors[i].time, result: result||'처치', opponent, guildToken, loot });
  }
  return rows;
}

async function handleFilesSelected(files){
  if(!files || !files.length) return;
  setState({ ocrBusy:true, ocrProgress:'준비 중...' });
  try{
    await loadTesseract();
    let allRows = [];
    let rawTextAll = '';
    let debugImage = '';
    for(const file of files){
      setState({ ocrBusy:true, ocrProgress:`이미지 처리 중 (${file.name})` });
      const canvas = await preprocessForOcr(file);
      if(!debugImage){
        try{ debugImage = canvas.toDataURL('image/png'); }catch(e){}
      }
      setState({ ocrBusy:true, ocrProgress:`이미지 인식 중 (${file.name})` });
      const { data } = await window.Tesseract.recognize(canvas, 'kor+eng', {
        logger: m => {
          if(m.status === 'recognizing text'){
            setState({ ocrBusy:true, ocrProgress:`인식 중... ${Math.round((m.progress||0)*100)}%` });
          }
        }
      });
      rawTextAll += (rawTextAll?'\n\n----------\n\n':'') + (data.text || '');
      allRows = allRows.concat(parsePvpOcrText(data.text || ''));
    }

    if(allRows.length === 0){
      setState({ ocrBusy:false, ocrProgress:'', ocrDebugOpen:true, ocrDebugText: rawTextAll, ocrDebugImage: debugImage });
      return;
    }

    const tracker = Object.assign({ guildName:'', count:0, keys:[] }, state.guildTracker);
    const existingKeys = new Set(tracker.keys || []);
    let added = 0, dup = 0, unmatched = 0, notKill = 0;
    const unmatchedTokens = [];

    allRows.forEach(r=>{
      if(r.result !== '처치'){ notKill++; return; }
      const key = `${r.date}_${r.time}`;
      if(existingKeys.has(key)){ dup++; return; }
      if(!fuzzyGuildMatch(r.guildToken, tracker.guildName)){
        unmatched++;
        unmatchedTokens.push(r.guildToken || '(빈값)');
        return;
      }
      existingKeys.add(key);
      added++;
    });

    tracker.count = (tracker.count || 0) + added;
    tracker.keys = Array.from(existingKeys);

    await saveGuildTracker(tracker);
    setState({ ocrBusy:false, ocrProgress:'', guildTracker: tracker });
    let msg = `${added}건 카운트 추가 (누적 ${tracker.count}회) · 중복 ${dup} · 길드불일치 ${unmatched} · 처치아님 ${notKill}`;
    if(unmatchedTokens.length){
      msg += `\n인식된 길드 텍스트: ${unmatchedTokens.slice(0,5).join(', ')}`;
    }
    showToast(msg);
  }catch(e){
    console.error(e);
    setState({ ocrBusy:false, ocrProgress:'' });
    showToast('이미지 인식에 실패했어요.', true);
  }
}

function groupByDate(list){
  const sorted = list.slice().sort((a,b)=> (b.date+b.createdAt) > (a.date+a.createdAt) ? 1 : -1);
  const groups = [];
  let last = null;
  sorted.forEach(r=>{
    if(r.date !== last){ groups.push({date:r.date, items:[]}); last = r.date; }
    groups[groups.length-1].items.push(r);
  });
  return groups;
}

    if(guildOverlay){
      guildOverlay.addEventListener('click', e=>{ if(e.target===guildOverlay) setState({guildModalOpen:false}); });
      document.getElementById('btn-guild-close').onclick = () => setState({guildModalOpen:false});
      document.getElementById('btn-guild-save').onclick = () => saveGuildName();
    }

    const ocrDebugOverlay = document.getElementById('ocr-debug-overlay');
    if(ocrDebugOverlay){
      ocrDebugOverlay.addEventListener('click', e=>{ if(e.target===ocrDebugOverlay) setState({ocrDebugOpen:false, ocrDebugText:''}); });
      document.getElementById('btn-ocr-debug-close').onclick = () => setState({ocrDebugOpen:false, ocrDebugText:''});
    }
  }
}

function submitModal(){
  const $ = sel => document.querySelector(sel);
  const type = state.activeTab;
  const date = $('#f-date').value || todayStr();
  const errEl = $('#modal-err');

  if(type==='pvp'){
    const opponent = $('#f-opponent').value.trim();
    const result = $('#f-result').value;
    const score = $('#f-score').value;
    const memo = $('#f-memo').value.trim();
    if(!opponent){ errEl.textContent='상대 닉네임을 입력해 주세요.'; return; }
    addRecord('pvp', { date, opponent, result, score: score?Number(score):null, memo });
  }else if(type==='storage'){
    const item = $('#f-item').value.trim();
    const direction = $('#f-direction').value;
    const qty = $('#f-qty').value;
    const memo = $('#f-memo').value.trim();
    if(!item){ errEl.textContent='아이템명을 입력해 주세요.'; return; }
    if(!qty || Number(qty)<=0){ errEl.textContent='수량을 입력해 주세요.'; return; }
    addRecord('storage', { date, item, direction, qty:Number(qty), memo });
  }else{
    const bossName = $('#f-boss').value.trim();
    const time = $('#f-time').value;
    const participants = $('#f-participants').value.trim();
    const memo = $('#f-memo').value.trim();
    if(!bossName){ errEl.textContent='보스명을 입력해 주세요.'; return; }
    addRecord('boss', { date, time, bossName, participants, memo });
  }
}

init();
</script>
